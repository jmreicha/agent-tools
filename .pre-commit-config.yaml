---
# Use the local Node, because nodeenv can't parse prerelease Node versions.
default_language_version:
  node: system
exclude: ^hooks/arbiter/vendor/
repos:
  - repo: local
    hooks:
      - id: gen-skills-docs
        name: Generate skills docs
        entry: python3 script/gen-skills-docs.py
        language: system
        pass_filenames: false
        always_run: true

      - id: test-skills
        name: Check skill names, descriptions, and links
        entry: python3 script/test_skills.py
        language: system
        pass_filenames: false
        files: ^skills/

      # Evals cost money and take minutes, so run them only on request:
      # pre-commit run eval-changed --hook-stage manual
      - id: eval-changed
        name: Run evals for changed skills
        entry: python3 script/eval-changed.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: test-scripts
        name: Test repo scripts
        entry: bash -c 'for t in script/test_*.py; do python3 "$t" || exit 1; done'
        language: system
        pass_filenames: false
        files: ^script/

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.10
    hooks:
      - id: commitizen

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: v0.79.0
    hooks:
      - id: oxfmt
        types_or: [javascript, ts, json, yaml, markdown]
        # Templates are Jinja, and formatting breaks the YAML they render.
        exclude: ^skills/[^/]+/templates/

  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.94.0
    hooks:
      - id: oxlint

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.5
    hooks:
      - id: rumdl

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args: ["--skip=*.yaml"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        args: ["-w", "-s", "-i", "4"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.24.1
    hooks:
      - id: zizmor
        args: ["--min-severity", "medium", "--min-confidence", "medium"]
