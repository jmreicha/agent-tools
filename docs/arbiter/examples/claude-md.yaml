# Enforceable rules from ~/.claude/CLAUDE.md, as arbiter rules.
# Install: copy to ~/.claude/rules/arbiter/claude-md.yaml once arbiter ships.
# Not codified (guidance only): brevity, 2-line comments, context7, `op read` for creds,
# never print secrets (needs output scanning, not a tool-call rule).

rules:
  # "Never use aws sso login. It leaves credentials in plaintext."
  - id: aws/no-sso-login
    match: { cmd: aws, args: [sso, login] }
    reason: "aws sso login leaves plaintext credentials on disk."
    hint: "Use `aws-vault exec <profile> -- aws ...` instead."
    tests:
      deny:
        - aws sso login
        - aws sso login --profile prod
        - aws-vault exec lytxread -- aws sso login
      allow:
        - aws sso list-accounts
        - git commit -m "never run aws sso login"

  # "Always use aws-vault when connecting to AWS."
  - id: aws/requires-vault
    match: { cmd: aws }
    unless: { wrapped_by: aws-vault }
    reason: "AWS access goes through aws-vault."
    hint: "Run `aws-vault exec lytxread -- aws ...`, not `aws --profile`."
    tests:
      deny:
        - aws s3 ls
        - aws s3 ls --profile prod
        - AWS_PROFILE=prod aws s3 ls
        - cd infra && aws s3 ls | head
        - echo $(aws sts get-caller-identity)
      allow:
        - aws-vault exec lytxread -- aws s3 ls
        - aws-vault exec lytxread -- bash -c 'aws s3 ls | head'
        - echo "aws s3 ls"
        - aws-vault list

  # "Always use the lytxread role unless told otherwise or elevated privileges are required."
  - id: aws/prefer-lytxread
    match: { cmd: aws-vault, args: [exec] }
    unless: { args: [exec, "lytxread*"] }
    action: ask
    reason: "This uses an AWS role other than lytxread."
    hint: "Use `aws-vault exec lytxread` unless elevated access is required."
    tests:
      ask:
        - aws-vault exec admin -- aws s3 ls
        - aws-vault exec --debug prod-admin -- aws iam list-users
      allow:
        - aws-vault exec lytxread -- aws s3 ls
        - aws-vault exec lytxread-prod -- aws s3 ls
        - aws-vault list

  # "Always use kubectl --context with an existing profile."
  - id: k8s/require-context
    match: { cmd: kubectl }
    unless:
      - { flags: [--context] }
      - { args: [config] }
      - { args: [version], flags: [--client] }
    reason: "kubectl must target an explicit context."
    hint: "Pass `--context <existing-context>` (see `kubectl config get-contexts`)."
    tests:
      deny:
        - kubectl get pods
        - kubectl -n kube-system get pods
      allow:
        - kubectl --context prod get pods
        - kubectl get pods --context=prod
        - kubectl config get-contexts
        - kubectl version --client

  # "Never create new Kubernetes profiles in ~/.kube/config."
  - id: k8s/no-new-contexts
    match:
      - cmd: kubectl
        args:
          [config, [set-context, set-cluster, set-credentials, rename-context]]
      - cmd: aws
        args: [eks, update-kubeconfig]
    reason: "New kube contexts pollute ~/.kube/config."
    hint: "Use an existing context from `kubectl config get-contexts`; ask the user if none fits."
    tests:
      deny:
        - kubectl config set-context dev --cluster=dev
        - aws-vault exec lytxread -- aws eks update-kubeconfig --name prod
      allow:
        - kubectl config get-contexts
        - kubectl config use-context prod

  - id: k8s/kubeconfig-readonly
    tool: [Edit, Write]
    match: { path: "~/.kube/config" }
    reason: "Claude must not edit ~/.kube/config."
    hint: "Use an existing context; ask the user to change kube config."
    tests:
      deny: ["~/.kube/config"]
      allow: ["~/.kube/other-config"]

  # "Always ask before making potentially destructive changes to AWS, Kubernetes, GCloud."
  - id: cloud/ask-destructive-k8s
    match:
      cmd: kubectl
      args:
        [
          [
            delete,
            drain,
            cordon,
            scale,
            apply,
            replace,
            patch,
            edit,
            rollout,
            annotate,
            label,
            taint,
          ],
        ]
    action: ask
    reason: "This kubectl command changes cluster state."
    tests:
      ask:
        - kubectl --context prod delete pod web-1
        - kubectl --context prod apply -f deploy.yaml
      allow:
        - kubectl --context prod get pods
        - kubectl --context prod logs deploy/delete-worker

  - id: cloud/ask-destructive-aws
    match:
      cmd: aws
      args:
        [
          [
            "delete-*",
            "terminate-*",
            "remove-*",
            "put-*",
            "update-*",
            "modify-*",
            "create-*",
            "rm",
            "rb",
            "mv",
          ],
        ]
    action: ask
    reason: "This AWS command changes cloud resources."
    tests:
      ask:
        - aws-vault exec lytxread -- aws ec2 terminate-instances --instance-ids i-1
        - aws-vault exec lytxread -- aws s3 rm s3://bucket/key
      allow:
        - aws-vault exec lytxread -- aws ec2 describe-instances
        - aws-vault exec lytxread -- aws s3 ls

  - id: cloud/ask-destructive-gcloud
    match:
      {
        cmd: gcloud,
        args:
          [
            [
              delete,
              create,
              update,
              deploy,
              set-iam-policy,
              add-iam-policy-binding,
            ],
          ],
      }
    action: ask
    reason: "This gcloud command changes cloud resources."
    tests:
      ask: ["gcloud compute instances delete vm-1"]
      allow: ["gcloud compute instances list"]

  - id: cloud/ask-iac-apply
    match:
      - { cmd: [terraform, tofu], args: [[apply, destroy, import]] }
      - { cmd: helm, args: [[install, upgrade, uninstall, rollback]] }
    action: ask
    reason: "This applies infrastructure changes."
    tests:
      ask: ["terraform apply", "tofu destroy", "helm upgrade web ./chart"]
      allow: ["terraform plan", "helm list"]
