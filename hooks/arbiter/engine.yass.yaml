# yaml-language-server: $schema=https://textla.dev/yass/v1.schema.json
---
description: >
  Decides the verdict for one tool call against the effective rule set, and runs a rule's
  inline tests.
version: v1
---
spec: evaluate
INPUT:
  - MUST: "take a tool name, the tool call's arguments, the effective rule set, the user's home directory, and optionally the calls that ran before it, oldest first, each as a tool name, a call key, and the ids of repeat rules it matched, defaulting to none"
    CONFORMS: rules@loadLayers::RETURN
  - MUST: "consider only rules whose `tool` matches the tool name, comparing strings exactly and /regex/ by search"
RETURN:
  - MUST: "return a verdict with an `action` of `allow`, `deny`, `ask`, or `warn`, every rule that fired whatever its action, sorted by `id`, and a `message`"
  - WHEN: "the tool is Bash"
    MUST: "parse the `command` argument and test each rule against each sub-command"
    SEE: shell@parse
  - WHEN: "the tool call has a `file_path` argument"
    MUST: "test `path` matchers against `file_path` after expanding a leading `~` to the user's home"
  - WHEN: "the tool is Bash"
    MUST: "test `path` matchers against every sub-command's `redirects` and `args`, after expanding a leading `~`, `$HOME`, or `${HOME}` to the user's home and prefixing a relative target with `./`"
  - MUST: "fire a rule for a sub-command or path when its `match` matches and its `unless` does not match the same sub-command or path"
  - MUST: "fire a rule that has no `match` on every call whose tool its `tool` matches"
  - WHEN: "the rule has `repeat`"
    MUST: "fire it only when it would otherwise fire and `n`, one plus the number of earlier calls that matched it, reaches `count`, where earlier calls are counted from the most recent back through at most `within - 1` of them, stopping at the first whose tool `reset_on` matches, and, when `same` is true, counting only calls whose key equals this call's key"
  - MUST: "treat a list of matchers under `match` or `unless` as matching when any one of them matches"
  - MUST: "match a matcher only when every key it has matches"
  - MUST: "compare a pattern string as a /regex/ by search when written `/body/flags`, otherwise as a whole-value glob"
  - MUST: "match `cmd` against the sub-command's `cmd`"
  - MUST: "match `args` when its elements match positional arguments in order, not necessarily adjacent, each element by exact string, glob, or any-of for a nested list"
  - MUST: "match `flags` when every listed flag is among the sub-command's `flags`, compared exactly, so `-f` does not match `-rf`"
  - MUST: "match `wrapped_by` when any listed name is among the sub-command's `wrappers`"
  - MUST: "match `env` when every listed name is in the sub-command's `env` with a value matching its string or glob"
  - MUST: "match `regex` by searching the sub-command's `raw`"
  - MUST: "match `piped_to` when some sub-command with the same `pipe` and a later `stage` matches it as a matcher"
  - MUST-NOT: "match a matcher holding command fields against a tool call that is not Bash, or a `path` matcher against a call that is neither Bash nor has a `file_path`"
  - MUST: "choose the verdict's `action` as the strictest among fired rules, in the order deny, rewrite, ask, warn, and `allow` when none fired, rewrite ranking above ask so the rewritten command is what an ask is about"
  - WHEN: "the action is `deny`"
    MUST: "set `message` to one line per fired deny rule, sorted by `id`, of the form `arbiter <id>: <description> <hint>`, omitting a missing description or hint"
  - WHEN: "the action is `ask`, `rewrite`, or `warn`"
    MUST: "set `message` to the same line form, built from the fired rules of that action"
  - WHEN: "a fired rule in the message has `repeat`"
    MUST: "end its line with ` (<n> matching calls in the last <within>)`"
  - WHEN: "the action is `allow`"
    MUST: "set `message` to an empty string"
INVARIANT:
  - MUST: "return the same verdict for the same inputs"
---
spec: callKey
RETURN:
  - MUST: "return the trimmed `command` for a Bash call, otherwise the `file_path` argument, otherwise an empty string"
---
spec: matchedRepeat
RETURN:
  - MUST: "return the ids of rules with `repeat` that would fire on the call if `repeat` were ignored"
INVARIANT:
  - MUST: "return the same result for the same inputs"
---
spec: runRuleTests
INPUT:
  - MUST: "take one rule and the user's home directory"
RETURN:
  - MUST: "evaluate each input listed in the rule's `tests`, using a rule set holding only that rule"
    SEE: evaluate
  - MUST: "use the input as the Bash `command` when the rule's matchers hold command fields, and as `file_path` when they hold `path`, expanding a leading `~` in the input to the given home directory"
  - WHEN: "the rule has no `match`"
    MUST: "use each input as the tool name, with no arguments, keeping the rule's own `tool`"
  - MUST: "use `Bash` as the tool name for command rules and `Edit` for path rules, with the rule's `tool` replaced by that name for the test"
  - WHEN: "the input is listed under `rewrite`"
    MUST: "pass when the verdict is `rewrite` and rewriting the input gives exactly the expected command"
    SEE: rewrite
  - MUST: "pass an input when the verdict's action equals the key it is listed under, where `allow` means the rule did not fire"
  - MUST: "return one result per input with the rule `id`, the input, the expected and actual action, and whether it passed"
  - MUST: "return an empty list for a rule without `tests`"
  - WHEN: "the rule has `repeat`"
    MUST: "treat each listed entry as a sequence of steps, evaluate the steps in order against a history that starts empty and gains each step after it is evaluated, and compare the last step's action with the key"
  - WHEN: "a step is `{ tool: <name> }`"
    MUST: "evaluate it as a call to that tool with no arguments"
  - WHEN: "a step is a string"
    MUST: "use it as a single input would be used"
  - MUST: "report a sequence's input as its steps joined by ` -> `, a bare call written `{ tool: <name> }`"
---
spec: rewrite
INPUT:
  - MUST: "take a Bash command, the verdict for it, and the user's home directory"
    CONFORMS: evaluate::RETURN
RETURN:
  - MUST: "apply the `to` edits of every fired `rewrite` rule to every sub-command it fired on, and return the command with those edits spliced into the original text, leaving all other text unchanged"
  - MUST: "insert `prefix` and a space at the start of the `cmd` word, after any leading assignments"
  - MUST: "replace the `cmd` word with `cmd`"
  - MUST: "replace a flag word named in `flags` with its replacement, keeping an attached `=value`, or remove it with the space after it when the replacement is null"
  - MUST: "also remove the value word after a removed flag when a template in the same rule read that flag's value from it"
  - MUST: "remove a leading assignment named in `env`, with the space after it"
  - MUST: "fill each template with its first present alternative, quoting a value that is not made only of letters, digits, and `@%+=:,./_-` in single quotes"
ERROR:
  - WHEN: "a sub-command to edit has no `spans`"
    MUST: "return an error saying the command is too complex to rewrite safely"
  - WHEN: "two edits overlap"
    MUST: "return an error naming the rules involved"
  - WHEN: "a template has no present alternative"
    MUST: "return an error naming the template"
INVARIANT:
  - MUST: "return the same result for the same inputs"
